<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひなまる隊｜缶バッジ配布管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f6;color:#17201f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{background:linear-gradient(135deg,#087e6c,#12b995);color:#fff;padding:22px 16px}
h1{font-size:21px;margin:0 0 4px}
.sub{font-size:12px;opacity:.9}
main{max-width:700px;margin:auto;padding:15px}
.panel{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
h2{font-size:17px;margin:0 0 14px}
label{display:block;font-size:13px;color:#596866;margin:12px 0 6px}
input{width:100%;font:inherit;border:1px solid #d5dfdd;border-radius:11px;padding:13px;background:#fff}
button{width:100%;font:inherit;font-weight:750;border:0;border-radius:11px;padding:13px;margin-top:14px}
.primary{background:#087e6c;color:#fff}
.secondary{background:#e6f3f0;color:#087e6c}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:13px;text-align:center}
.num{font-size:24px;font-weight:800}
.lab{font-size:11px;color:#687574}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #edf0ef}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e4efec;font-weight:800;flex:none}
.info{flex:1;min-width:0}
.name{font-weight:750}
.id{font-size:13px;color:#087e6c}
.meta{font-size:11px;color:#788482;margin-top:3px}
.badge{font-size:11px;background:#e6f3f0;color:#087e6c;padding:7px 9px;border-radius:99px;white-space:nowrap}
.search{margin-bottom:4px}
.empty{text-align:center;color:#7b8583;padding:22px 5px}
.note{font-size:12px;color:#687574;line-height:1.5;margin-top:10px}
</style>
</head>

<body>

<header>
<h1>🎖️ ひなまる隊 缶バッジ配布管理</h1>
<div class="sub">名前とX IDを入力して配布済み登録</div>
</header>

<main>

<div class="stats">
<div class="stat">
<div class="num" id="total">0</div>
<div class="lab">登録人数</div>
</div>

<div class="stat">
<div class="num" id="given">0</div>
<div class="lab">配布済み</div>
</div>
</div>

<section class="panel">

<h2>📝 配布登録</h2>

<label for="name">名前</label>
<input
id="name"
type="text"
placeholder="例：HALU">

<label for="xid">X ID</label>
<input
id="xid"
type="text"
placeholder="例：@1980Halu">

<label for="memo">メモ（任意）</label>
<input
id="memo"
type="text"
placeholder="例：京都2部">

<button
class="primary"
id="register">
🎖️ 配布済みとして登録
</button>

<div class="note">
※ X IDは「@」付きでも無しでも登録できます。<br>
※ 同じX IDの二重登録は防止します。
</div>

</section>

<section class="panel">

<h2>🔎 登録済みユーザー</h2>

<input
class="search"
id="search"
type="text"
placeholder="名前・X ID・メモで検索">

<div id="list"></div>

</section>

<section class="panel">

<button
class="secondary"
id="clearAll">
⚠️ 全データを削除
</button>

</section>

</main>

<script>
"use strict";

const KEY = "hinamaru_badges_simple_v1";

let users = [];

try{

  users =
    JSON.parse(
      localStorage.getItem(KEY) || "[]"
    );

  if(!Array.isArray(users)){
    users = [];
  }

}catch(e){

  users = [];

}


const $ = id =>
  document.getElementById(id);


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(users)
  );

  render();

}


function cleanXid(value){

  let x =
    String(value || "").trim();

  x =
    x.replace(
      /[＠﹫]/g,
      "@"
    );

  if(
    x &&
    !x.startsWith("@")
  ){

    x =
      "@" +
      x.slice(0,15);

  }

  return x;

}


function esc(s){

  return String(
    s ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])
  );

}


function render(){

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const shown =
    users.filter(u =>
      `${u.name} ${u.xid} ${u.memo}`
        .toLowerCase()
        .includes(q)
    );


  $("total").textContent =
    users.length;


  $("given").textContent =
    users.filter(
      u => u.given
    ).length;


  if(!shown.length){

    $("list").innerHTML =
      '<div class="empty">まだ登録されていません</div>';

    return;

  }


  $("list").innerHTML =
    shown.map(u => `

      <div class="item">

        <div class="avatar">
          ${esc(
            (u.name || "?")
              .slice(0,1)
          )}
        </div>

        <div class="info">

          <div class="name">
            ${esc(u.name)}
          </div>

          <div class="id">
            ${esc(u.xid)}
          </div>

          <div class="meta">
            ${esc(u.memo || "")}
            ${esc(u.date || "")}
          </div>

        </div>

        <span class="badge">
          ✓ 配布済み
        </span>

      </div>

    `).join("");

}


$("register")
.addEventListener(
  "click",
  () => {

    const name =
      $("name")
        .value
        .trim();


    const xid =
      cleanXid(
        $("xid").value
      );


    const memo =
      $("memo")
        .value
        .trim();


    if(
      !name ||
      !xid
    ){

      alert(
        "名前とX IDを入力してください"
      );

      return;

    }


    const old =
      users.find(
        u =>
          String(u.xid)
            .toLowerCase() ===
          xid.toLowerCase()
      );


    if(old){

      alert(
        "このX IDはすでに登録されています。"
      );

      return;

    }


    users.unshift({

      id:
        Date.now().toString(),

      name,

      xid,

      memo,

      given:true,

      date:
        new Date()
          .toLocaleString("ja-JP")

    });


    save();


    $("name").value =
      "";

    $("xid").value =
      "";

    $("memo").value =
      "";


    alert(
      "🎖️ 配布済みとして登録しました！"
    );

  }
);


$("search")
.addEventListener(
  "input",
  render
);


$("clearAll")
.addEventListener(
  "click",
  () => {

    if(!users.length){

      alert(
        "削除するデータがありません"
      );

      return;

    }


    if(
      confirm(
        "登録データをすべて削除しますか？"
      )
    ){

      users = [];

      save();

    }

  }
);


render();

</script>

</body>
</html>
