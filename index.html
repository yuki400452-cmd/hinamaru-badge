<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひなまる隊｜缶バッジ配布管理</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:#202124;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f7f6;
}

header{
  background:linear-gradient(135deg,#008f7a,#19b99e);
  color:white;
  padding:28px 20px 24px;
}

header h1{
  margin:0 0 8px;
  font-size:25px;
}

header p{
  margin:0;
  font-size:14px;
  opacity:.95;
}

main{
  max-width:720px;
  margin:auto;
  padding:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:white;
  border-radius:18px;
  padding:16px 8px;
  text-align:center;
  box-shadow:0 3px 12px #0000000d;
}

.stat strong{
  display:block;
  font-size:30px;
}

.stat span{
  font-size:13px;
  color:#687574;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #0000000d;
}

h2{
  font-size:19px;
  margin:0 0 16px;
}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
}

input,textarea{
  width:100%;
  border:1px solid #d7dfdd;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

button{
  flex:1;
  min-width:130px;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#008f7a;
  color:white;
}

.secondary{
  background:#eef3f2;
  color:#333;
}

.danger{
  background:#fff0f0;
  color:#c62828;
}

.status{
  margin-top:12px;
  min-height:22px;
  font-size:14px;
  color:#087e6c;
  font-weight:700;
}

.search{
  margin-bottom:12px;
}

.item{
  border:1px solid #e0e6e4;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.item-name{
  font-size:17px;
  font-weight:800;
}

.item-xid{
  color:#087e6c;
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#e6f7f3;
  color:#087e6c;
  font-size:12px;
  font-weight:700;
}

.item-meta{
  margin-top:8px;
  color:#687574;
  font-size:13px;
  white-space:pre-wrap;
}

.empty{
  text-align:center;
  color:#687574;
  padding:20px 5px;
}

@media(max-width:500px){
  main{padding:12px}
  header{padding:22px 16px}
  header h1{font-size:22px}
  .stats{gap:7px}
  .stat{padding:13px 5px}
  .stat strong{font-size:26px}
}
</style>
</head>

<body>

<header>
  <h1>🎖️ ひなまる隊｜缶バッジ配布管理</h1>
  <p>名前とX IDを入力して、配布状況を管理します</p>
</header>

<main>

  <!-- 統計 -->
  <section class="stats">
    <div class="stat">
      <strong id="total">0</strong>
      <span>登録人数</span>
    </div>

    <div class="stat">
      <strong id="given">0</strong>
      <span>配布済み</span>
    </div>

    <div class="stat">
      <strong id="notGiven">0</strong>
      <span>未配布</span>
    </div>
  </section>

  <!-- 登録 -->
  <section class="card">

    <h2>👤 配布ユーザー登録</h2>

    <label for="name">名前</label>
    <input
      id="name"
      type="text"
      placeholder="名前を入力してください"
      autocomplete="off"
    >

    <label for="xid">X ID</label>
    <input
      id="xid"
      type="text"
      placeholder="@ユーザー名を入力してください"
      autocomplete="off"
    >

    <label for="memo">メモ（任意）</label>
    <textarea
      id="memo"
      placeholder="必要ならメモを入力してください"
    ></textarea>

    <div class="buttons">
      <button class="primary" id="register">
        🎖️ 配布済みとして登録
      </button>

      <button class="secondary" id="clear">
        クリア
      </button>
    </div>

    <div class="status" id="status"></div>

  </section>

  <!-- 検索 -->
  <section class="card">

    <h2>🔎 登録ユーザー検索</h2>

    <input
      class="search"
      id="search"
      type="search"
      placeholder="名前・@ID・メモで検索"
    >

    <div id="list"></div>

  </section>

</main>

<script>

const STORAGE_KEY = "hinamaru_users_v1";

let users = loadUsers();

function loadUsers(){
  try{
    const data = localStorage.getItem(STORAGE_KEY);

    if(!data){
      return [];
    }

    const parsed = JSON.parse(data);

    return Array.isArray(parsed) ? parsed : [];

  }catch(error){

    console.error(error);

    return [];
  }
}

function saveUsers(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(users)
  );

}

function normalizeXid(value){

  let xid = value.trim();

  if(xid && !xid.startsWith("@")){
    xid = "@" + xid;
  }

  return xid;
}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function updateStats(){

  const total = users.length;

  const given = users.filter(
    user => user.given === true
  ).length;

  const notGiven = total - given;

  document.getElementById("total").textContent = total;
  document.getElementById("given").textContent = given;
  document.getElementById("notGiven").textContent = notGiven;

}

function render(){

  updateStats();

  const keyword =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  let filtered = users;

  if(keyword){

    filtered = users.filter(user => {

      return (
        user.name.toLowerCase().includes(keyword) ||
        user.xid.toLowerCase().includes(keyword) ||
        user.memo.toLowerCase().includes(keyword)
      );

    });

  }

  const list = document.getElementById("list");

  if(filtered.length === 0){

    list.innerHTML =
      '<div class="empty">登録ユーザーはいません</div>';

    return;
  }

  list.innerHTML = filtered.map(user => {

    const date =
      user.givenAt || user.createdAt || "";

    return `
      <div class="item">

        <div class="item-head">

          <div>
            <div class="item-name">
              ${escapeHTML(user.name)}
            </div>

            <div class="item-xid">
              ${escapeHTML(user.xid)}
            </div>
          </div>

          <span class="badge">
            ${user.given ? "配布済み" : "未配布"}
          </span>

        </div>

        ${
          user.memo
          ? `<div class="item-meta">
               📝 ${escapeHTML(user.memo)}
             </div>`
          : ""
        }

        ${
          date
          ? `<div class="item-meta">
               登録日時：${escapeHTML(date)}
             </div>`
          : ""
        }

        <div class="buttons">

          <button
            class="secondary"
            onclick="toggleGiven('${user.id}')"
          >
            ${
              user.given
              ? "未配布に戻す"
              : "配布済みにする"
            }
          </button>

          <button
            class="danger"
            onclick="deleteUser('${user.id}')"
          >
            削除
          </button>

        </div>

      </div>
    `;

  }).join("");

}

function showStatus(message){

  const status =
    document.getElementById("status");

  status.textContent = message;

  setTimeout(() => {

    status.textContent = "";

  },3000);

}

document
  .getElementById("register")
  .addEventListener("click",() => {

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    let xid =
      normalizeXid(
        document
          .getElementById("xid")
          .value
      );

    const memo =
      document
        .getElementById("memo")
        .value
        .trim();

    if(!name || !xid){

      alert("名前とX IDを入力してください");

      return;
    }

    if(xid === "@"){

      alert("X IDを入力してください");

      return;
    }

    const old =
      users.find(
        user =>
          user.xid.toLowerCase() === xid.toLowerCase()
      );

    if(old){

      if(old.given){

        alert(
          "このX IDはすでに配布済みです。"
        );

        return;
      }

      old.name = name;
      old.memo = memo;
      old.given = true;
      old.givenAt =
        new Date().toLocaleString("ja-JP");

      saveUsers();

      showStatus(
        "🎖️ 配布済みとして登録しました！"
      );

    }else{

      users.unshift({

        id:
          Date.now().toString(),

        name:name,

        xid:xid,

        memo:memo,

        given:true,

        createdAt:
          new Date().toLocaleString("ja-JP"),

        givenAt:
          new Date().toLocaleString("ja-JP")

      });

      saveUsers();

      showStatus(
        "🎖️ 配布済みとして登録しました！"
      );

    }

    document.getElementById("name").value = "";
    document.getElementById("xid").value = "";
    document.getElementById("memo").value = "";

    render();

  });

document
  .getElementById("clear")
  .addEventListener("click",() => {

    document.getElementById("name").value = "";
    document.getElementById("xid").value = "";
    document.getElementById("memo").value = "";

    document.getElementById("status").textContent = "";

  });

document
  .getElementById("search")
  .addEventListener("input",render);

function toggleGiven(id){

  const user =
    users.find(
      user => user.id === id
    );

  if(!user){
    return;
  }

  user.given = !user.given;

  if(user.given){

    user.givenAt =
      new Date().toLocaleString("ja-JP");

  }else{

    user.givenAt = "";

  }

  saveUsers();

  render();

}

function deleteUser(id){

  const user =
    users.find(
      user => user.id === id
    );

  if(!user){
    return;
  }

  const ok =
    confirm(
      `${user.name}（${user.xid}）を削除しますか？`
    );

  if(!ok){
    return;
  }

  users =
    users.filter(
      user => user.id !== id
    );

  saveUsers();

  render();

}

render();

</script>

</body>
</html>
