<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ひなまる隊 缶バッジ管理</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", Meiryo, sans-serif;
      background: #f5f3f8;
      color: #222;
    }
    header {
      background: linear-gradient(135deg, #25133f, #55317b);
      color: white;
      padding: 22px 16px;
    }
    header h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; opacity: .9; font-size: 13px; }
    main { max-width: 900px; margin: 18px auto; padding: 0 12px 40px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }
    h2 { margin: 0 0 16px; font-size: 19px; }
    label {
      display: block;
      font-weight: 700;
      margin: 12px 0 6px;
      font-size: 14px;
    }
    input, select, textarea, button {
      width: 100%;
      font: inherit;
      border-radius: 10px;
    }
    input, select, textarea {
      border: 1px solid #d6d0df;
      padding: 11px 12px;
      background: #fff;
    }
    textarea { min-height: 76px; resize: vertical; }
    button {
      border: 0;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 700;
      margin-top: 12px;
    }
    .primary { background: #5b2d82; color: white; }
    .secondary { background: #eee9f3; color: #3b2750; }
    .danger { background: #f5dddd; color: #8b1e1e; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }
    .stat strong { display: block; font-size: 24px; }
    .stat span { font-size: 12px; color: #666; }
    .user {
      border: 1px solid #e2dce8;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
      background: #fff;
    }
    .user-name { font-size: 18px; font-weight: 800; }
    .user-xid { color: #666; margin-top: 3px; }
    .user-memo { margin-top: 8px; white-space: pre-wrap; }
    .user-meta { margin-top: 8px; font-size: 12px; color: #666; }
    .status {
      display: inline-block;
      margin-top: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .given { background: #e7f4e5; color: #286321; }
    .notgiven { background: #f0edf3; color: #5c5364; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions button { margin-top: 10px; }
    #message {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .ok { background: #e7f5e9; color: #245b2c; }
    .ng { background: #fdeaea; color: #8a1e1e; }
    .small { font-size: 12px; color: #777; margin-top: 7px; }
    @media (max-width: 650px) {
      .grid, .stats, .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header>
  <h1>🧸 ひなまる隊 缶バッジ管理</h1>
  <p>配布ユーザーの登録・配布状況・登録者を管理します</p>
</header>

<main>
  <div id="message"></div>

  <div class="stats">
    <div class="stat"><strong id="total">0</strong><span>登録者数</span></div>
    <div class="stat"><strong id="givenCount">0</strong><span>配布済み</span></div>
    <div class="stat"><strong id="remaining">0</strong><span>未配布</span></div>
  </div>

  <section class="card">
    <h2>📝 配布ユーザーを登録</h2>

    <div class="grid">
      <div>
        <label for="name">名前</label>
        <input id="name" type="text" placeholder="例：ひなちゃん" autocomplete="off">
      </div>

      <div>
        <label for="xid">X ID</label>
        <input id="xid" type="text" placeholder="例：@example" autocomplete="off">
      </div>
    </div>

    <label for="registeredBy">登録者</label>
    <select id="registeredBy">
      <option value="ひなまる隊">ひなまる隊</option>
      <option value="ゆう">ゆう</option>
      <option value="ちいくま">ちいくま</option>
      <option value="ひなた">ひなた</option>
    </select>

    <label for="memo">メモ（任意）</label>
    <textarea id="memo" placeholder="例：京都1部で受け取り"></textarea>

    <button class="primary" onclick="registerUser(false)">未配布で登録</button>
    <button class="secondary" onclick="registerUser(true)">配布済みで登録</button>
    <div class="small">登録者を選んでから登録してください。</div>
  </section>

  <section class="card">
    <h2>🔎 登録者を検索</h2>
    <input id="search" type="search" placeholder="名前・X ID・メモ・登録者で検索" oninput="render()">
  </section>

  <section class="card">
    <h2>📋 登録一覧</h2>
    <div id="list"></div>
  </section>
</main>

<script>
  // =========================================================
  // ★ここだけ最初に変更
  // Apps Scriptを「ウェブアプリ」としてデプロイしたURLを入れる
  // 例：https://script.google.com/macros/s/XXXXXXXX/exec
  // =========================================================
  const SHEET_API_URL = "ここにApps ScriptのウェブアプリURLを貼る";

  const STORAGE_KEY = "hinamaru_badge_users_v3";
  let users = [];

  function showMessage(text, ok = true) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.className = ok ? "ok" : "ng";
    box.style.display = "block";
    setTimeout(() => box.style.display = "none", 3500);
  }

  function normalizeXid(value) {
    let v = String(value || "").trim();
    if (!v) return "";
    if (!v.startsWith("@")) v = "@" + v;
    return v;
  }

  function escapeHtml(text) {
    return String(text ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
  }

  function loadLocal() {
    try {
      users = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(users)) users = [];
    } catch (_) {
      users = [];
    }
  }

  async function apiPost(payload) {
    if (!SHEET_API_URL || SHEET_API_URL.includes("ここにApps Script")) {
      throw new Error("Apps ScriptのウェブアプリURLがまだ設定されていません。");
    }

    const response = await fetch(SHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const text = await response.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (_) {
      throw new Error("Google側から正しいJSONが返ってきませんでした。");
    }

    if (!data.success) {
      throw new Error(data.error || "Googleスプレッドシートへの保存に失敗しました。");
    }
    return data;
  }

  async function apiGet() {
    if (!SHEET_API_URL || SHEET_API_URL.includes("ここにApps Script")) return null;

    const response = await fetch(SHEET_API_URL + "?action=list", { method: "GET" });
    const data = await response.json();
    if (!data.success) throw new Error(data.error || "一覧取得に失敗しました。");
    return data.users || [];
  }

  async function loadFromSheet() {
    try {
      const remote = await apiGet();
      if (remote) {
        users = remote;
        saveLocal();
        render();
      }
    } catch (error) {
      console.warn(error);
      showMessage("Googleからの読み込みに失敗したため、端末に保存されたデータを表示しています。", false);
    }
  }

  async function registerUser(given) {
    const name = document.getElementById("name").value.trim();
    const xid = normalizeXid(document.getElementById("xid").value);
    const memo = document.getElementById("memo").value.trim();
    const registeredBy = document.getElementById("registeredBy").value;

    if (!name || !xid) {
      alert("名前とX IDを入力してください。");
      return;
    }

    const exists = users.some(user =>
      String(user.xid || "").toLowerCase() === xid.toLowerCase()
    );

    if (exists) {
      alert("このX IDはすでに登録されています。");
      return;
    }

    const user = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      xid,
      name,
      memo,
      registeredBy,
      given: !!given,
      createdAt: new Date().toLocaleString("ja-JP")
    };

    // まず画面側へ反映
    users.unshift(user);
    saveLocal();
    render();

    // Googleへ保存
    try {
      await apiPost({
        action: "register",
        ...user
      });
      showMessage(`「${registeredBy}」として登録しました。`);
    } catch (error) {
      // Google保存に失敗したら画面上の仮登録も戻す
      users = users.filter(u => u.id !== user.id);
      saveLocal();
      render();
      alert("登録に失敗しました。\n\n" + error.message);
      return;
    }

    document.getElementById("name").value = "";
    document.getElementById("xid").value = "";
    document.getElementById("memo").value = "";
  }

  async function toggleGiven(id) {
    const user = users.find(u => u.id === id);
    if (!user) return;

    const newGiven = !user.given;
    user.given = newGiven;
    saveLocal();
    render();

    try {
      await apiPost({
        action: "update",
        id: user.id,
        xid: user.xid,
        name: user.name,
        memo: user.memo,
        registeredBy: user.registeredBy,
        given: user.given,
        createdAt: user.createdAt
      });
      showMessage(newGiven ? "配布済みに変更しました。" : "未配布に戻しました。");
    } catch (error) {
      user.given = !newGiven;
      saveLocal();
      render();
      alert("変更をGoogleへ保存できませんでした。\n\n" + error.message);
    }
  }

  async function deleteUser(id) {
    const user = users.find(u => u.id === id);
    if (!user) return;

    if (!confirm(`${user.name}（${user.xid}）を削除しますか？`)) return;

    const oldUsers = [...users];
    users = users.filter(u => u.id !== id);
    saveLocal();
    render();

    try {
      await apiPost({ action: "delete", id: user.id, xid: user.xid });
      showMessage("削除しました。");
    } catch (error) {
      users = oldUsers;
      saveLocal();
      render();
      alert("Googleから削除できませんでした。\n\n" + error.message);
    }
  }

  function render() {
    const keyword = document.getElementById("search").value.trim().toLowerCase();

    const filtered = users.filter(user => {
      const text = [
        user.name,
        user.xid,
        user.memo,
        user.registeredBy
      ].join(" ").toLowerCase();
      return text.includes(keyword);
    });

    const list = document.getElementById("list");
    list.innerHTML = "";

    if (!filtered.length) {
      list.innerHTML = '<div class="small">該当する登録者はいません。</div>';
    }

    filtered.forEach(user => {
      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <div class="user-name">${escapeHtml(user.name)}</div>
        <div class="user-xid">${escapeHtml(user.xid)}</div>
        <div class="status ${user.given ? "given" : "notgiven"}">
          ${user.given ? "🎁 配布済み" : "📦 未配布"}
        </div>
        ${user.memo ? `<div class="user-memo">${escapeHtml(user.memo)}</div>` : ""}
        <div class="user-meta">
          登録者：${escapeHtml(user.registeredBy || "不明")}
          ／ 登録日時：${escapeHtml(user.createdAt || "")}
        </div>
        <div class="actions">
          <button class="secondary" onclick="toggleGiven('${escapeHtml(user.id)}')">
            ${user.given ? "未配布に戻す" : "配布済みにする"}
          </button>
          <button class="danger" onclick="deleteUser('${escapeHtml(user.id)}')">🗑 削除</button>
        </div>
      `;

      list.appendChild(div);
    });

    updateStats();
  }

  function updateStats() {
    const total = users.length;
    const given = users.filter(u => u.given).length;

    document.getElementById("total").textContent = total;
    document.getElementById("givenCount").textContent = given;
    document.getElementById("remaining").textContent = total - given;
  }

  loadLocal();
  render();
  loadFromSheet();
</script>
</body>
</html>
