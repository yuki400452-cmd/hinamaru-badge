<!doctype html>
<html lang="ja">
<head><link rel="apple-touch-icon" href="./hinamaru_icon_180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひなまる隊｜缶バッジ配布管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#17201f;background:#f4f7f6}
*{box-sizing:border-box}body{margin:0;background:#f4f7f6}header{background:linear-gradient(135deg,#087e6c,#12b995);color:white;padding:20px 16px}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;opacity:.9}main{max-width:760px;margin:auto;padding:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.card,.panel{background:white;border-radius:16px;box-shadow:0 2px 10px #0000000b}.card{text-align:center;padding:12px 6px}.num{font-size:24px;font-weight:800}.lab{font-size:11px;color:#687574}.panel{padding:15px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 11px}.camera{border:2px dashed #b9ceca;border-radius:14px;padding:18px;text-align:center;background:#f7fbfa}
.camera strong{display:block;font-size:16px;margin-bottom:5px}.hint{font-size:12px;color:#667573;line-height:1.5}
button{font:inherit;border:0;border-radius:11px;padding:12px 15px;font-weight:750;min-height:44px;cursor:pointer}.primary{background:#087e6c;color:#fff}.secondary{background:#e6f3f0;color:#086d5d}.danger{background:#fff0ef;color:#a42319}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}input,textarea{width:100%;font:inherit;border:1px solid #d5dfdd;border-radius:10px;padding:11px;background:#fff}label{display:block;font-size:12px;color:#596866;margin:9px 0 5px}
.preview{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#111;margin-top:10px;display:none}.status{margin-top:10px;font-size:12px;color:#596866}.ok{color:#087e6c;font-weight:700}
.review{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #edf0ef}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e4efec;font-weight:800;flex:none}.info{flex:1;min-width:0}.name{font-weight:750}.id{font-size:12px;color:#087e6c}.meta{font-size:11px;color:#788482;margin-top:2px}.badge{padding:7px 8px;border-radius:99px;font-size:11px;background:#e6f3f0;color:#087e6c;white-space:nowrap}
.search{margin-bottom:8px}.empty{text-align:center;color:#7b8583;padding:22px 5px}small{display:block;color:#7a8583;line-height:1.5;margin-top:8px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🎖️ ひなまる隊 缶バッジ配布管理</h1><div class="sub">現地で「撮影 → 自動認識 → 確認 → 配布済み」を最短操作</div></header>
<main>
<section class="cards">
<div class="card"><div class="num" id="total">0</div><div class="lab">登録人数</div></div>
<div class="card"><div class="num" id="given">0</div><div class="lab">配布済み</div></div>
<div class="card"><div class="num" id="left">0</div><div class="lab">未配布</div></div>
</section>

<section class="panel">
<h2>📸 1. Xプロフィールを撮影</h2>
<div class="camera">
<strong>相手のXプロフィール画面を撮影</strong>
<div class="hint">プロフィール画面の「名前」と「@ユーザー名」が見える状態で撮影してください。</div>
<div class="btns" style="justify-content:center">
<label for="photo" class="primary" style="margin:0;padding:12px 15px;border-radius:11px;color:white;font-weight:750;cursor:pointer">📷 カメラを起動</label>
<input id="photo" type="file" accept="image/*" capture="environment" style="display:none">
</div>
<img id="preview" class="preview" alt="撮影したプロフィール画像">
<div id="ocrStatus" class="status">写真を撮ると自動認識を開始します。</div>
</div>
</section>

<section class="panel review" id="review">
<h2>✏️ 2. 認識結果を確認</h2>
<div class="grid">
<div><label>名前</label><input id="name" placeholder="自動認識"></div>
<div><label>X ID</label><input id="xid" placeholder="@example"></div>
</div>
<label>メモ（任意）</label><input id="memo" placeholder="例：京都・2部">
<div class="btns">
<button class="primary" id="register">🎖️ 登録して配布済みにする</button>
<button class="secondary" id="reset">撮り直す</button>
</div>
<small>「登録して配布済みにする」を押した瞬間に、今回の缶バッジを渡した記録として保存します。</small>
</section>

<section class="panel">
<h2>🔎 配布ユーザー</h2>
<input class="search" id="search" placeholder="名前・@ID・メモで検索">
<div id="list"></div>
</section>
</main>

<script>
const KEY="hinamaru_badges_v2";
let users=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(users));render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 const q=$("search").value.toLowerCase();
 const shown=users.filter(u=>`${u.name} ${u.xid} ${u.memo}`.toLowerCase().includes(q));
 $("total").textContent=users.length;
 $("given").textContent=users.filter(u=>u.given).length;
 $("left").textContent=users.filter(u=>!u.given).length;
 $("list").innerHTML=shown.length?shown.map(u=>`<div class="item">
 <div class="avatar">${esc((u.name||"?").slice(0,1))}</div>
 <div class="info"><div class="name">${esc(u.name)}</div><div class="id">${esc(u.xid)}</div><div class="meta">${esc(u.memo||"")}・${esc(u.date)}</div></div>
 <span class="badge">${u.given?"✓ 配布済み":"未配布"}</span></div>`).join(""):'<div class="empty">まだ登録されたユーザーはいません</div>';
}
function showReview(name,xid){
  $("name").value=name||"";
  $("xid").value=xid||"";
  $("review").style.display="block";
  $("review").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
}

function detect(text){
  // OCR文字を整える
  const normalized = String(text ?? "")
    .replace(/[＠﹫]/g, "@")
    .replace(/[｜|]/g, "I")
    .replace(/[‐-‒–—−]/g, "-")
    .replace(/\u00a0/g, " ");

  const lines = normalized
    .split(/\r?\n/)
    .map(s => s.trim())
    .filter(Boolean);

  // -------------------------
  // X ID（@ユーザー名）を探す
  // -------------------------
  const xidMatches = [
    ...normalized.matchAll(
      /@[A-Za-z0-9_]{1,15}/g
    )
  ];

  let xid = xidMatches.length
    ? xidMatches[0][0]
    : "";

  // OCRで @ が落ちた場合にも対応
  if(!xid){
    const noAt = normalized.match(
      /(?:^|\s)([A-Za-z0-9_]{1,15})(?:\s|$)/m
    );

    if(noAt){
      const candidate = noAt[1];

      // よくある誤認識・UI文字を除外
      const badWords = [
        "follow",
        "followers",
        "following",
        "posts",
        "post",
        "reply",
        "likes",
        "media",
        "home",
        "search",
        "通知",
        "フォロー",
        "フォロワー",
        "フォロー中"
      ];

      if(
        candidate.length >= 2 &&
        !badWords.some(w =>
          candidate.toLowerCase() === w.toLowerCase()
        )
      ){
        xid = "@" + candidate;
      }
    }
  }

  // -------------------------
  // X IDの位置を探す
  // -------------------------
  let idIndex = -1;

  if(xid){
    idIndex = lines.findIndex(line =>
      line.includes(xid.replace(/^@/,"")) ||
      line.includes(xid)
    );
  }

  // -------------------------
  // 名前を探す
  // X IDの直前にある短い文字列を優先
  // -------------------------
  let nameLine = "";

  if(idIndex > 0){

    for(let i = idIndex - 1; i >= Math.max(0,idIndex - 4); i--){

      const candidate = lines[i];

      if(!candidate) continue;

      // @から始まるものはIDなので除外
      if(candidate.startsWith("@")) continue;

      // UI文字を除外
      if(
        candidate.includes("フォロー") ||
        candidate.includes("フォロワー") ||
        candidate.includes("フォロー中") ||
        candidate.includes("返信") ||
        candidate.includes("投稿") ||
        candidate.includes("いいね")
      ) continue;

      // 数字だけは除外
      if(/^\d+$/.test(candidate)) continue;

      // 日付・時刻っぽいものを除外
      if(/^\d{1,4}[:/.-]\d{1,2}/.test(candidate)) continue;

      // URLを除外
      if(/https?:\/\//i.test(candidate)) continue;

      // 長すぎる文章は除外
      if(candidate.length > 40) continue;

      nameLine = candidate;
      break;
    }
  }

  // -------------------------
  // IDが見つからない場合
  // 名前だけでも候補を探す
  // -------------------------
  if(!nameLine){

    nameLine = lines.find(line => {

      if(line.startsWith("@")) return false;

      if(line.length < 1 || line.length > 20) return false;

      if(line.includes("フォロー")) return false;
      if(line.includes("フォロワー")) return false;
      if(line.includes("フォロー中")) return false;
      if(line.includes("返信")) return false;
      if(line.includes("投稿")) return false;
      if(line.includes("いいね")) return false;

      if(/https?:\/\//i.test(line)) return false;

      if(/^\d+$/.test(line)) return false;

      return true;
    }) || "";
  }

  // -------------------------
  // 結果を画面に表示
  // -------------------------
  showReview(nameLine, xid);

  return {
  name: nameLine,
  xid: xid
};
 }
// 写真を選択・撮影したとき
// OCR強化版
// ================================
// ================================
// 写真を選択・撮影したとき
// OCR強化版
// ================================

$("photo").addEventListener("change", async (e) => {

  const file = e.target.files?.[0];

  if (!file) {
    console.log("写真が選択されていません");
    return;
  }

  const preview = $("preview");
  const ocrStatus = $("ocrStatus");

  console.log("写真を取得しました:", file.name, file.type);

  // -------------------------------
  // プレビュー表示
  // -------------------------------

  const imageUrl = URL.createObjectURL(file);

  preview.src = imageUrl;
  preview.style.display = "block";

  ocrStatus.textContent =
    "🔍 写真を読み込んでいます…";

  try {

    // -------------------------------
    // Tesseract.js 読み込み
    // -------------------------------

    if (!window.Tesseract) {

      ocrStatus.textContent =
        "🔍 OCRエンジンを起動しています…";

      await new Promise((resolve, reject) => {

        const script =
          document.createElement("script");

        script.src =
          "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

        script.onload = resolve;

        script.onerror = () => {
          reject(
            new Error("Tesseract.jsの読み込みに失敗しました")
          );
        };

        document.head.appendChild(script);

      });

    }

    // -------------------------------
    // OCR開始
    // -------------------------------

    ocrStatus.textContent =
      "🔍 Xプロフィールを自動認識中…";

    console.log("OCR開始");

    const result = await Tesseract.recognize(
      file,
      "jpn+eng",
      {
        logger: message => {

          console.log("OCR:", message);

          if (message.status === "recognizing text") {

            const percent =
              Math.round(
                (message.progress || 0) * 100
              );

            ocrStatus.textContent =
              `🔍 文字を認識中… ${percent}%`;
          }

        }
      }
    );

    // -------------------------------
    // OCR結果
    // -------------------------------

    const text =
      result?.data?.text || "";

    console.log("====================");
    console.log("OCR RESULT");
    console.log(text);
    console.log("====================");

    // -------------------------------
    // OCR結果なし
    // -------------------------------

    if (!text.trim()) {

      ocrStatus.textContent =
        "⚠️ 文字を読み取れませんでした";

      showReview("", "");

      return;
    }

    // -------------------------------
    // detect()でX IDを検索
    // -------------------------------

    console.log("detect開始");

    const found = detect(text);

    console.log("detect結果:", found);

    // -------------------------------
    // X ID発見
    // -------------------------------

    if (found && found.xid) {

      ocrStatus.innerHTML =
        '<span class="ok">✓ X IDを認識しました</span>';

      showReview(
        found.name || "",
        found.xid || ""
      );

    }

    // -------------------------------
    // X IDが見つからない
    // -------------------------------

    else {

      ocrStatus.textContent =
        "⚠️ X IDを認識できませんでした。プロフィール画面全体が写るように撮影してください。";

      showReview(
        found?.name || "",
        ""
      );

    }

  } catch (error) {

    console.error("OCR ERROR:", error);

    ocrStatus.textContent =
      "⚠️ 自動認識に失敗しました。もう一度撮影してください。";

    showReview("", "");

  }

});



// 配布済みに登録
$("register").addEventListener("click",()=>{

  let name=$("name").value.trim();
  let xid=$("xid").value.trim();

  if(xid && !xid.startsWith("@")){
    xid="@"+xid;
  }

  if(
    !name ||
    !xid ||
    xid==="@"
  ){
    alert("名前とX IDを確認してください");
    return;
  }

  const old=users.find(
    u=>u.xid.toLowerCase()===xid.toLowerCase()
  );

  if(old){

    if(old.given){

      alert(
        "このX IDはすでに配布済みです。二重配布を防止しました。"
      );

      return;
    }

    old.name=name;
    old.memo=$("memo").value.trim();
    old.given=true;
    old.givenAt=new Date().toLocaleString("ja-JP");

  }else{

    users.unshift({
      id:Date.now().toString(),
      name:name,
      xid:xid,
      memo:$("memo").value.trim(),
      given:true,
      date:new Date().toLocaleDateString("ja-JP"),
      givenAt:new Date().toLocaleString("ja-JP")
    });

  }

  save();

  $("review").style.display="none";
  $("photo").value="";
  $("preview").style.display="none";

  $("ocrStatus").textContent=
    "写真を撮ると自動認識を開始します。";

  alert("🎖️ 配布済みとして登録しました！");

});


// 撮り直す
$("reset").addEventListener("click",()=>{

  $("review").style.display="none";

  $("photo").value="";

  $("preview").style.display="none";

  $("ocrStatus").textContent=
    "写真を撮ると自動認識を開始します。";

});


// 検索
$("search").addEventListener(
  "input",
  render
);


// 初期表示
render();
