<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="apple-touch-icon" href="./hinamaru_icon_180.png">

<title>ひなまる隊｜缶バッジ配布管理</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",
  "Helvetica Neue",Meiryo,sans-serif;
  color:#202124;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7f6;
}

header{
  background:linear-gradient(135deg,#008f7a,#19b99e);
  color:white;
  padding:24px 18px 22px;
}

header h1{
  margin:0 0 6px;
  font-size:24px;
}

header p{
  margin:0;
  font-size:14px;
}

main{
  max-width:700px;
  margin:auto;
  padding:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:white;
  border-radius:18px;
  padding:16px 8px;
  text-align:center;
  box-shadow:0 3px 12px #0000000d;
}

.stat strong{
  display:block;
  font-size:27px;
}

.stat span{
  color:#687074;
  font-size:13px;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 14px #0000000d;
}

.card h2{
  margin:0 0 14px;
  font-size:18px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d5dcda;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  margin-top:12px;
  cursor:pointer;
}

.primary{
  background:#008f7a;
  color:white;
}

.secondary{
  background:#eef3f2;
  color:#202124;
}

.user{
  border:1px solid #e0e5e3;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}

.user-name{
  font-size:17px;
  font-weight:bold;
}

.user-xid{
  color:#008f7a;
  margin-top:3px;
}

.user-memo{
  color:#687074;
  font-size:13px;
  margin-top:6px;
}

.user-status{
  margin-top:10px;
  font-weight:bold;
}

.given{
  color:#008f7a;
}

.notgiven{
  color:#e67e22;
}

.empty{
  text-align:center;
  color:#8a9290;
  padding:20px 0;
}

.notice{
  background:#f0faf7;
  border-radius:12px;
  padding:12px;
  font-size:13px;
  color:#087c6b;
  margin-top:10px;
}

@media(max-width:500px){
  main{
    padding:12px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:13px 5px;
  }

  .stat strong{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🏅 ひなまる隊 缶バッジ配布管理</h1>
  <p>名前とX IDを入力して配布状況を管理します</p>
</header>

<main>

  <section class="stats">
    <div class="stat">
      <strong id="total">0</strong>
      <span>登録人数</span>
    </div>

    <div class="stat">
      <strong id="givenCount">0</strong>
      <span>配布済み</span>
    </div>

    <div class="stat">
      <strong id="remaining">0</strong>
      <span>未配布</span>
    </div>
  </section>

  <section class="card">
    <h2>📝 配布ユーザーを登録</h2>

    <label for="name">名前</label>
    <input
      id="name"
      type="text"
      placeholder="例：ひなちゃん"
      autocomplete="off"
    >

    <label for="xid">X ID</label>
    <input
      id="xid"
      type="text"
      placeholder="例：@example"
      autocomplete="off"
    >
<label for="registeredBy">登録者</label>
<select id="registeredBy">
    <option value="ひなまる隊">ひなまる隊</option>
    <option value="ゆう">ゆう</option>
    <option value="ちいくま">ちいくま</option>
    <option value="ひなた">ひなた</option>
</select>
    <label for="memo">メモ（任意）</label>
    <input
      id="memo"
      type="text"
      placeholder="例：京都ミーグリ"
      autocomplete="off"
    >

    <button class="primary" id="register">
      🏅 配布済みとして登録
    </button>

    <button class="secondary" id="registerNotGiven">
      未配布として登録
    </button>

    <div class="notice">
      ※ X IDは「example」と入力しても自動で「@example」にします。
    </div>
  </section>

  <section class="card">
    <h2>🔎 配布ユーザー</h2>

    <input
      id="search"
      type="text"
      placeholder="名前・@ID・メモで検索"
      autocomplete="off"
    >

    <div id="list"></div>
  </section>

</main>

<script>

const STORAGE_KEY = "hinamaru_users_v1";
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxY9U53zMsj5acE6_N34w5EaTKeHeCn1BR0anAGQzIF-ULEWzJNMY8jkUanjli27RqR/exec";

let users = [];

function load(){
  try{
    users = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );
  }catch(e){
    users = [];
  }
}

function save(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(users)
  );
}
async function syncToSheet(user){

  try{

    await fetch(SHEET_API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify({
        xId:user.xid,
        name:user.name,
        status:user.given ? "配布済み" : "未配布",
        registeredAt:user.createdAt,
        registeredBy:user.registeredBy
      })
    });

  }catch(error){

    console.error(
      "スプレッドシート連携エラー:",
      error
    );

  }
}


  
function normalizeXid(xid){

  xid = xid.trim();

  if(!xid){
    return "";
  }

  if(!xid.startsWith("@")){
    xid = "@" + xid;
  }

  return xid;
}

function updateStats(){

  const total = users.length;

  const given = users.filter(
    user => user.given
  ).length;

  document.getElementById("total").textContent = total;
  document.getElementById("givenCount").textContent = given;
  document.getElementById("remaining").textContent =
    total - given;
}

function render(){

  const keyword =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const list =
    document.getElementById("list");

  list.innerHTML = "";

  const filtered = users.filter(user => {

    const text = [
      user.name,
      user.xid,
      user.memo
    ]
    .join(" ")
    .toLowerCase();

    return text.includes(keyword);
  });

  if(filtered.length === 0){

    list.innerHTML =
      '<div class="empty">登録ユーザーはいません</div>';

    updateStats();
    return;
  }

  filtered.forEach(user => {

    const div =
      document.createElement("div");

    div.className = "user";

    div.innerHTML = `
      <div class="user-name">
        ${escapeHtml(user.name)}
      </div>

      <div class="user-xid">
        ${escapeHtml(user.xid)}
      </div>

      ${
        user.memo
        ? `<div class="user-memo">
             ${escapeHtml(user.memo)}
           </div>`
        : ""
      }

      <div class="user-status ${
        user.given ? "given" : "notgiven"
      }">
        ${user.given ? "🏅 配布済み" : "⏳ 未配布"}
      </div>

      <button
        class="secondary"
        onclick="toggleGiven('${user.id}')"
      >
        ${user.given ? "未配布に戻す" : "配布済みにする"}
      </button>

      <button
        class="secondary"
        onclick="deleteUser('${user.id}')"
      >
        🗑 削除
      </button>
    `;

    list.appendChild(div);
  });

  updateStats();
}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function register(given){

  const name =
    document.getElementById("name")
      .value
      .trim();

  const xid =
    normalizeXid(
      document.getElementById("xid").value
    );

  const memo =
    document.getElementById("memo")
      .value
      .trim();
const registeredBy =
    document.getElementById("registeredBy").value;

  if(!name || !xid){

    alert("名前とX IDを入力してください。");
    return;
  }

  const exists =
    users.find(
      user =>
        user.xid.toLowerCase() ===
        xid.toLowerCase()
    );

  if(exists){

    alert(
      "このX IDはすでに登録されています。"
    );

    return;
  }

  users.unshift({

    id:
      Date.now().toString() +
      Math.random()
        .toString(36)
        .slice(2),

    name:name,
    xid:xid,
    memo:memo,
    registeredby:registeredBy,
    given:given,
    createdAt:
      new Date().toLocaleString("ja-JP")

  });

  save();
syncToSheet(users[0]);
  document.getElementById("name").value = "";
  document.getElementById("xid").value = "";
  document.getElementById("memo").value = "";
document.getElementById("registeredBy").value = "ひなまる隊";
  render();

  alert(
    given
      ? "🏅 配布済みとして登録しました！"
      : "登録しました！"
  );
}

function toggleGiven(id){

  const user =
    users.find(
      user => user.id === id
    );

  if(!user) return;

  user.given = !user.given;

  save();
  render();
}

function deleteUser(id){

  const user =
    users.find(
      user => user.id === id
    );

  if(!user) return;

  if(
    !confirm(
      `${user.name}（${user.xid}）を削除しますか？`
    )
  ){
    return;
  }

  users =
    users.filter(
      user => user.id !== id
    );

  save();
  render();
}

document
  .getElementById("register")
  .addEventListener(
    "click",
    () => register(true)
  );

document
  .getElementById("registerNotGiven")
  .addEventListener(
    "click",
    () => register(false)
  );

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );

load();
render();

</script>

</body>
</html>
